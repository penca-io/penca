[project]
name = "penca-workspace"
version = "0.1.0"
description = "Penca workspace root"
requires-python = ">=3.10"
# The workspace packages, so `uv run` and `uv sync` at the repo root install
# them editable. Declaring them as `members` below is not enough — uv only
# installs a workspace member that something actually depends on, so without
# these a fresh clone gets no `penca_client` and `examples/sandbox_demo.py`
# fails at import with ModuleNotFoundError.
dependencies = [
    "penca-client",
    "penca-proto",
    # `examples/` print their tables via `to_pandas().to_markdown()`, so these
    # are runtime needs of the repo root, not dev tools. tabulate in
    # particular is an *optional* pandas dependency, so `to_markdown()` raises
    # ImportError without it — and it otherwise lives only in penca-client's
    # dev group, which a plain root `uv sync` does not install.
    "pandas>=2.3.3",
    "pyarrow>=23.0.0",  # matches penca-client; a looser floor here would lie
    "tabulate>=0.10.0",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
penca-client = { workspace = true }
penca-proto = { workspace = true }

[dependency-groups]
dev = [
    "grpcio-tools>=1.70.0",
    "ipython>=8.39.0",
    "matplotlib>=3.10.9",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-xdist>=3.6",
    "ruff>=0.15.0",
    "streamlit>=1.58.0",
    "ty>=0.0.15",
]

[tool.ruff]
target-version = "py310"
line-length = 88
# force-exclude makes the exclusion hold even when paths are passed
# explicitly (pre-commit and `ruff format <path>` both do), so committed
# generated stubs stay byte-identical to `just compile-protos-py` output.
force-exclude = true
# extend-exclude, not exclude: `exclude` REPLACES ruff's built-in default list,
# which would drop .venv / build / dist / node_modules now that lint and format
# discover from the repo root. Extending leaves the defaults in force rather than
# resting the guarantee on .gitignore.
extend-exclude = [
    "packages/penca-proto/src/penca_proto",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.format]

[[tool.ty.overrides]]
include = ["scripts/**"]
[tool.ty.overrides.rules]
unresolved-import = "ignore"

[[tool.ty.overrides]]
include = ["packages/penca-proto/src/penca_proto/**"]
[tool.ty.overrides.rules]
conflicting-metaclass = "ignore"

# psycopg.sql type narrowing: SQL vs Composed vs Composable, LiteralString,
# and cursor.execute accepting Composable at runtime despite typed as Query
[[tool.ty.overrides]]
include = [
    "packages/penca-client/src/penca_client/arrow.py",
    "packages/penca-client/src/penca_client/naming.py",
    "packages/penca-client/src/penca_client/_time.py",
    "tests/integration/integration_helpers.py",
]
[tool.ty.overrides.rules]
invalid-argument-type = "ignore"

# pydantic_settings populates BaseSettings fields from env vars at
# runtime, but ty sees the bare class and reports the env-driven fields
# as missing constructor arguments.
[[tool.ty.overrides]]
include = ["packages/penca-client/tests/unit/test_config.py"]
[tool.ty.overrides.rules]
missing-argument = "ignore"

# Proto-shape regression tests in this file read ``*Response.DESCRIPTOR.fields``
# to verify the wire schema. ty can't fully type protobuf reflection
# (DESCRIPTOR is typed as ``Unknown | None``), so its
# ``unresolved-attribute`` rule flags every reflection call. The runtime
# behavior is correct — the static check is just noise here.
[[tool.ty.overrides]]
include = ["tests/integration/integration_per_table_lifecycle_test.py"]
[tool.ty.overrides.rules]
unresolved-attribute = "ignore"

[tool.pytest.ini_options]
testpaths = ["packages/penca-client/tests/unit", "packages/penca-proto/tests"]
# The parallel/serial split selects on a bare string, so a typo'd mark
# (`serail`) would otherwise degrade to a warning and drop a side-channel
# reader into the `-n auto` phase — an intermittent race instead of an error.
#
# It must be the ini form. `addopts = ["--strict-markers"]` is inert on pytest
# 9: the flag only appends to `override_ini`, but `Config.parse` builds
# `_inicfg` from the command line before injecting `addopts`, and never
# recomputes it — so the `MarkGenerator` check reads the unset default. The ini
# key below is read from `_inicfg` and does fail collection.
#
# `filterwarnings` is belt-and-braces for the same typo. It is kept because it
# is independent, but it is the weaker of the two: it reports a warning
# traceback rather than "'serail' not found in `markers`", and a stray `-W` or
# `@pytest.mark.filterwarnings` can switch it off.
#
# Neither guards the `-m` EXPRESSION — `-m "not serail"` silently matches
# everything. That gap is why the recipe's phases must not both be allowed to
# collect zero tests.
strict_markers = true
filterwarnings = ["error::pytest.PytestUnknownMarkWarning"]
markers = [
    "serial: tests that must run alone, outside the -n auto parallel phase. Two reasons, and only the first goes away with CHA-519: (a) the test reads a process-global side channel — container stdout via container_log/poll_log_for, or pg_stat_statements reset+count — which a concurrent worker pollutes; (b) the test deliberately parks a servicer PG connection (advisory lock, LOCK TABLE) while asserting a bounded time, so concurrent workers contending for the same PG_POOL_MAX=4 pool would make it flaky in both directions.",
]
