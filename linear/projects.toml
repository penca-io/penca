# Linear projects for Penca.
# Each project is a time-bound initiative with its own backlog.
# The sync-linear script creates missing projects and assigns issues
# to them using the keywords defined here.

[lifecycle-engine]
name = "Lifecycle Engine"
description = "Building out lifecycle RPCs: persist, compact, snapshot, prune"
linear_project_id = "5fe2e036-e1d9-4208-837f-6e7a58d64f56"
keywords = [
    "persist",
    "compact",
    "snapshot",
    "prune",
    "lifecycle",
    "segment",
    "ingest",
    "purge",
    "retention",
]

