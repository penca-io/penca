name: CI

on:
  # Per-PR signal (CHA-458). The pull_request event tests refs/pull/N/merge —
  # the PR already merged onto its base — so a green run means the *merge
  # result* compiles and passes the light checks, not just the branch in
  # isolation. Re-enabled after being disabled for Actions budget; per-PR cost
  # stays bounded because the Docker-heavy `integration` job is held back to the
  # merge queue (see its `if:` below).
  pull_request:
    types: [opened, synchronize, reopened]
  # Merge queue (CHA-458). GitHub builds the prospective merge commit (this PR
  # rebased onto the latest main) and runs CI on it — including the full
  # integration suite — before merging. This is the gate that catches the
  # concurrent-PR break (the CHA-429 rename vs CHA-406 use that text-merged
  # clean but didn't compile): the queue re-tests each PR against *current*
  # main, serialized, so a green PR can't merge stale.
  merge_group:
  # Post-merge signal on main. With the merge queue the merged commit is the
  # one the queue already tested, so this is a canonical safety net (e.g. for an
  # admin-bypass merge); the `changes` paths-filter scopes the heavy jobs.
  # Release publish (CHA-187). Pushing a `v*` tag builds the same two-arch
  # manifest and publishes it as :<version> + :latest, so a reader can pin a
  # quickstart to an image that does not move under them the way :main does.
  # The version is the tag name, which keeps it anchored to a real commit —
  # there is no hand-typed version field anywhere.
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel an in-flight merge-queue run. Each queue entry already gets a
  # unique ref (gh-readonly-queue/…) so entries won't cancel each other, but
  # cancelling a merge_group run can eject the PR from the queue — so be
  # explicit rather than relying on the ref scheme.
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changed paths
    # Scopes whether the heavy integration job runs, on both events that can
    # actually merge code: the post-merge `push` to main and the `merge_group`
    # queue build. PRs skip integration unconditionally (queue-only), so this is
    # not consumed there. In the queue the prospective-merge commit is diffed
    # against the branch it's merging onto (merge_group base..head), so a
    # docs-only merge can skip the suite instead of always running it.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so paths-filter can reliably diff the merge_group
          # base..head (two arbitrary commits) as well as the push before-sha.
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # In the queue, diff the prospective-merge commit against the base the
          # queue is merging onto; on push, leave unset for paths-filter's
          # default (the push before-sha).
          base: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || '' }}
          ref: ${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha || '' }}
          filters: |
            rust:
              - 'crates/**'
              - 'protos/**'
              - 'docker/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'packages/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/ci.yml'
              - 'Justfile'
              - 'tests/integration/**'

  python-lint:
    name: Python lint + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-packages
      # Repo-wide, matching `just lint` / `just format-check` and the pre-commit
      # hook. A narrower scope here let examples/ and tests/ drift out of
      # compliance while CI stayed green.
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: python scripts/check_blank_lines.py

  python-unit:
    name: Python unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-packages
      - run: uv run pytest packages/penca-client/tests/unit/ -x -q
      # tests/static/ is Docker-free and is what gives non-package code
      # (examples/, scripts/) any pre-merge coverage at all — branch PRs skip the
      # integration job, so without this line those suites only ever ran locally
      # via `just check`.
      - run: uv run pytest tests/static/ -x -q

  fresh-clone:
    name: Fresh clone can run the examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # Deliberately a PLAIN `uv sync` — no --all-packages. Every other job uses
      # --all-packages, which installs each workspace member plus its dev group,
      # so all of them masked a root pyproject that declared no dependency on
      # penca-client at all: a fresh clone got no `penca_client` and the README's
      # very first command died at import. Same for tabulate, which pandas needs
      # for to_markdown() and treats as optional. This job is the only thing that
      # sees what a reader following the quick start actually gets.
      - run: uv sync
      - run: |
          uv run python - <<'PY'
          import importlib.util, sys
          from pathlib import Path

          # Import every example by path, exactly as `uv run python examples/x.py`
          # resolves them, and render a table through the pandas/tabulate path the
          # printers use. No services needed: this catches packaging, not behaviour.
          import pyarrow as pa
          print(pa.table({"ok": [1]}).to_pandas().to_markdown(index=False))

          for example in sorted(Path("examples").glob("*.py")):
              spec = importlib.util.spec_from_file_location(example.stem, example)
              module = importlib.util.module_from_spec(spec)
              sys.modules[spec.name] = module
              spec.loader.exec_module(module)
              print(f"imported {example}")
          PY

  rust-check:
    name: Rust clippy + fmt + test
    runs-on: ubuntu-latest
    # Trim debuginfo to line tables only. The full-DWARF object files for
    # the datafusion/arrow-heavy crates overflow the runner's disk during
    # the parallel test-link, so `ld` dies mmapping its output with
    # `signal 7 [Bus error]` (the ENOSPC-via-mmap signature, distinct from
    # a RAM-OOM SIGKILL). `line-tables-only` keeps file/line for panic
    # backtraces while dropping the bulk type/variable DWARF; it covers
    # `dev` (dependency rlibs, which dominate the linked size) and `test`
    # (the test binaries themselves). Belt-and-suspenders next lever if this
    # proves insufficient: free ~20-30GB by removing the preinstalled
    # .NET/GHC/Android SDKs at job start (e.g. jlumbroso/free-disk-space).
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Keep `--all-targets` in step with `just cargo-clippy`: without it clippy
      # skips `#[cfg(test)]` code, so an orphaned test helper merges green.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace

  integration:
    name: Integration tests (Rust backend)
    needs: changes
    # Queue-only (CHA-458). The Docker-heavy suite is the merge gate: it runs on
    # the merge queue's prospective-merge commit and on the post-merge push to
    # main, but NOT on pull_request, keeping per-PR minutes bounded. Both the
    # queue and push are path-scoped via `changes`, so a docs-only change skips
    # the suite. Fail-safe in the queue: run UNLESS `changes` positively reported
    # no Rust paths (`!= 'false'`) — any `changes` hiccup leaves the output empty
    # and still runs the gate rather than letting code merge unverified.
    # `always()` lets it fire even when `changes` is skipped/failed.
    if: >-
      always() &&
      ( (github.event_name == 'merge_group' && needs.changes.outputs.rust != 'false') ||
        (github.event_name == 'push' && needs.changes.outputs.rust == 'true') )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: extractions/setup-just@v2
      - uses: docker/setup-buildx-action@v3
      # JDK 21 + the flight-sql-jdbc-driver JAR are both required by
      # `TestFlightSqlJdbcProbe` (CHA-249). Without them the test
      # skips with an actionable message — which is fine for local
      # dev but would silently degrade CI coverage of the JDBC GUI
      # path, so we install + fetch unconditionally here.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: just fetch-jdbc-driver
      - run: uv sync --all-packages
      # Pre-build the Rust servicer image with BuildKit GHA cache.
      # cargo-chef layering means the cook-deps layer survives across
      # runs when Cargo.lock is unchanged; `mode=max` caches every
      # intermediate stage, not just the final one. `cache-from` lists
      # the branch scope first, then falls back to main for new
      # branches that start cold.
      - name: Pre-build penca-rust-server image (with GHA cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.rust-server
          tags: penca-rust-server:latest
          load: true
          cache-from: |
            type=gha
            type=gha,scope=main
          cache-to: type=gha,mode=max
          # Route the cook/build RUN steps through sccache→S3 when the
          # repo AWS secrets are present (CHA-440). The secret id matches
          # the Dockerfile's required=false aws_credentials mount; bucket
          # and region come from the image's SCCACHE_* env, so aws_config
          # is unnecessary here. Absent on fork PRs (repo secrets don't
          # flow), where the build degrades cleanly to a plain compile.
          secrets: |
            "aws_credentials=[default]
            aws_access_key_id=${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
            aws_secret_access_key=${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}"
      - name: Run integration suite
        env:
          # compose.yml defaults to the published GHCR image, so without this
          # the suite would test :main rather than the code under review.
          # Must stay equal to the pre-build step's `tags:` above — the
          # ghcr_publish static test pins the pair. If the pre-build were ever
          # skipped this tag is absent locally and compose falls back to
          # building from source: slow, but never silently the wrong code.
          PENCA_IMAGE: penca-rust-server:latest
          PENCA_SKIP_BUILD: "1"
        run: just integration-test
      - name: Print servicer logs on failure
        if: failure()
        run: |
          for f in /tmp/penca-logs-*/*.log; do
            [ -f "$f" ] || continue
            printf '\n========== %s ==========\n' "$f"
            cat "$f"
          done
      - name: Upload servicer logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-servicer-logs
          path: /tmp/penca-logs-*/*.log
          if-no-files-found: ignore

  # Publish the servicer image to GHCR so a fresh clone pulls in ~1 min
  # instead of compiling for 12-15 (CHA-187). Main merges only: the `push:`
  # trigger is already scoped to main, and `changes` keeps a docs-only merge
  # from rebuilding an identical image.
  #
  # One job per architecture on its own NATIVE runner, never QEMU. Emulated
  # rustc runs 5-20x slower and a ~13-min build can exceed the job timeout
  # outright, so `docker/setup-qemu-action` must not appear anywhere in this
  # file. Each leg pushes by digest only; `publish-image-merge` assembles the
  # two into one manifest list and owns the human-readable tags, so nothing
  # in docker/compose.yml has to know about architectures.
  publish-image:
    name: Publish image (${{ matrix.arch }})
    needs: changes
    # A `v*` tag publishes unconditionally: a release must never be silently
    # skipped because a paths-filter hiccuped, and `changes` is scoped to
    # main-merge diffs anyway. `always()` is what keeps a failed or skipped
    # `changes` from swallowing the release; a main push still requires a
    # positive rust=='true', so a docs-only merge rebuilds nothing.
    if: >-
      always() && github.event_name == 'push' &&
      ( startsWith(github.ref, 'refs/tags/v')
        || needs.changes.outputs.rust == 'true' )
    # Job-level permissions REPLACE the workflow-level block, so `contents`
    # has to be re-declared here or actions/checkout loses its read.
    permissions:
      contents: read
      packages: write
    strategy:
      # Surface both legs' results rather than cancelling the survivor; the
      # merge job is skipped either way (see its `needs:`).
      fail-fast: false
      matrix:
        include:
          # Cache mode differs per arch on purpose. The Actions cache is a
          # single 10 GB per-repository budget with LRU eviction, and a
          # mode=max scope over this cargo-chef cook layer is multiple GB —
          # three of them (integration's, plus one per arch) would evict each
          # other and push every build back toward cold, including the
          # merge-gating integration job.
          #
          # amd64 is the same platform and Dockerfile the integration job
          # already stores at mode=max, so it reads that scope and stores only
          # its own final stage. arm64 has no such sibling, so its scope is
          # the only cook-layer cache it will ever get and stays mode=max.
          # Risk therefore lands on the publish job (an occasional cold
          # rebuild) rather than on the merge gate.
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
            cache_from: |
              type=gha,scope=publish-amd64
              type=gha
            cache_mode: min
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            cache_from: type=gha,scope=publish-arm64
            cache_mode: max
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.rust-server
          platforms: ${{ matrix.platform }}
          # No `tags:` — a tag here would publish a single-arch image under a
          # human-readable name, which is the manifest-list-less state this
          # job exists to avoid.
          outputs: type=image,name=ghcr.io/penca-io/penca-rust-server,push-by-digest=true,name-canonical=true,push=true
          # Per-arch scopes: the two architectures share no layers, so one
          # shared scope would just thrash. See the matrix above for why the
          # store mode differs per arch.
          cache-from: ${{ matrix.cache_from }}
          cache-to: type=gha,scope=publish-${{ matrix.arch }},mode=${{ matrix.cache_mode }}
          # Same sccache→S3 wiring as the integration pre-build (CHA-440).
          # Inert on arm64: the Dockerfile gates its sccache download on
          # x86_64, so that leg leans on the layer cache alone.
          secrets: |
            "aws_credentials=[default]
            aws_access_key_id=${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
            aws_secret_access_key=${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}"
      # Job `outputs:` written from a matrix overwrite each other, last
      # writer wins, so they cannot carry two digests. Hand off through
      # artifacts instead: one empty file per leg, named for its digest.
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-image-merge:
    name: Publish image (manifest merge)
    # Plain `needs:` with no `always()`, deliberately. A matrix job's
    # aggregate result is `failure` if any leg failed, which skips this job —
    # that is what stops a one-arch manifest from ever reaching `:main`.
    needs: publish-image
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          image=ghcr.io/penca-io/penca-rust-server
          # A `v*` tag is a release: pin the version and move :latest onto it,
          # so :latest only ever means "newest release" and never "whatever
          # landed on main today". A main push gets the moving :main plus an
          # immutable short-sha to pin against.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            release_tag="${GITHUB_REF#refs/tags/}"
            tags=(-t "$image:$release_tag" -t "$image:latest")
          else
            release_tag=main
            tags=(-t "$image:main" -t "$image:${GITHUB_SHA::7}")
          fi
          echo "PUBLISHED_TAG=$release_tag" >> "$GITHUB_ENV"
          docker buildx imagetools create "${tags[@]}" \
            $(printf "$image@sha256:%s " *)
      - name: Inspect manifest list
        run: |
          docker buildx imagetools inspect \
            "ghcr.io/penca-io/penca-rust-server:${PUBLISHED_TAG}"

  # Single required status check for branch protection and the merge queue
  # (CHA-458). Requiring the conditional `integration` job directly would hang a
  # PR forever whenever paths-filter skips it (a skipped required check stays
  # pending); gating on this always()-job instead lets a skip count as a pass
  # while any real failure or cancellation fails the gate. Add `integration`'s
  # required-ness here, not in branch-protection settings.
  ci-success:
    name: CI success
    # Include `changes`: if it fails on a push, `integration`'s `if` reads its
    # output as '' and silently skips, losing the post-merge net with no signal
    # — so fail the gate instead. Its `skipped` result on PR/merge_group is
    # tolerated by the success|skipped case below.
    # The publish jobs are push-only, so they report `skipped` on
    # pull_request and merge_group and the case below tolerates them — the
    # merge gate is unchanged. What including them buys is the post-merge
    # signal: a failed publish leaves every new user pulling a stale :main,
    # and compose's fallback-to-build would disguise that as "just slow".
    needs:
      [
        changes,
        python-lint,
        python-unit,
        fresh-clone,
        rust-check,
        integration,
        publish-image,
        publish-image-merge,
      ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify no required job failed
        run: |
          echo "changes=${{ needs.changes.result }}"
          echo "python-lint=${{ needs.python-lint.result }}"
          echo "python-unit=${{ needs.python-unit.result }}"
          echo "fresh-clone=${{ needs.fresh-clone.result }}"
          echo "rust-check=${{ needs.rust-check.result }}"
          echo "integration=${{ needs.integration.result }}"
          echo "publish-image=${{ needs.publish-image.result }}"
          echo "publish-image-merge=${{ needs.publish-image-merge.result }}"
          for result in \
            "${{ needs.changes.result }}" \
            "${{ needs.python-lint.result }}" \
            "${{ needs.python-unit.result }}" \
            "${{ needs.fresh-clone.result }}" \
            "${{ needs.rust-check.result }}" \
            "${{ needs.integration.result }}" \
            "${{ needs.publish-image.result }}" \
            "${{ needs.publish-image-merge.result }}"; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::a required job did not pass (result=$result)"; exit 1 ;;
            esac
          done
          echo "All required jobs passed or were intentionally skipped."
